<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>五子棋 · 人机对战</title>
<style>
body { margin:0; background:#1c1c26; color:#eee; font-family:"Microsoft YaHei",sans-serif; display:flex; justify-content:center; align-items:center; min-height:100vh; }
#wrap { text-align:center; }
canvas { background:#deb466; border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.4); cursor:pointer; }
.menu { margin-top:20px; }
button { margin:6px; padding:10px 22px; font-size:16px; border:none; border-radius:8px; background:#30303a; color:#fff; cursor:pointer; }
button.active { background:#3282d2; }
button.start { background:#d2412d; padding:12px 40px; font-size:18px; }
button.exit { background:#50505a; }
label { margin:0 12px; font-size:15px; }
</style>
</head>
<body>
<div id="wrap">
<canvas id="board" width="700" height="700"></canvas>
<div class="menu" id="menu">
<div style="margin:10px 0;font-size:20px;">难度</div>
<button id="d1" class="active" onclick="setDiff(1)">简单</button>
<button id="d2" onclick="setDiff(2)">中等</button>
<button id="d3" onclick="setDiff(3)">困难</button>
<br>
<div style="margin:10px 0;font-size:20px;">执子</div>
<button id="c1" class="active" onclick="setColor(1)">黑棋</button>
<button id="c2" onclick="setColor(2)">白棋</button>
<button id="c0" onclick="setColor(0)">随机</button>
<br>
<label><input type="checkbox" id="forbidden"> 启用禁手（黑棋三三、四四、长连）</label>
<br>
<button class="start" onclick="startGame()">开 始</button>
<button class="exit" onclick="location.reload()">退 出</button>
</div>
<div id="ingame" style="display:none;margin-top:10px;">
<button onclick="undo()">撤回</button>
<button onclick="backMenu()">回到菜单</button>
</div>
</div>
<script>
const GRID=19, CELL=34, MARGIN=30;
const canvas=document.getElementById("board");
const ctx=canvas.getContext("2d");
let board=[], history=[], playerColor=1, aiColor=2, difficulty=1, useForbidden=false;
let gameOver=false, viewing=false, lastR=-1, lastC=-1, hoverR=-1, hoverC=-1, moveCount=0;

function setDiff(d){difficulty=d;["d1","d2","d3"].forEach((id,i)=>document.getElementById(id).classList.toggle("active",i+1===d));}
function setColor(c){playerColor=c;["c1","c2","c0"].forEach((id,i)=>document.getElementById(id).classList.toggle("active",(i===0&&c===1)||(i===1&&c===2)||(i===2&&c===0)));}

function drawBoard(){
  ctx.fillStyle="#deb466"; ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle="#321905"; ctx.lineWidth=1;
  for(let i=0;i<GRID;i++){
    ctx.beginPath(); ctx.moveTo(MARGIN,MARGIN+i*CELL); ctx.lineTo(MARGIN+(GRID-1)*CELL,MARGIN+i*CELL); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(MARGIN+i*CELL,MARGIN); ctx.lineTo(MARGIN+i*CELL,MARGIN+(GRID-1)*CELL); ctx.stroke();
  }
  ctx.fillStyle="#321905";
  [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]].forEach(([r,c])=>{
    ctx.beginPath(); ctx.arc(MARGIN+c*CELL,MARGIN+r*CELL,3,0,Math.PI*2); ctx.fill();
  });
}
function drawPiece(r,c,type,order=-1){
  const x=MARGIN+c*CELL, y=MARGIN+r*CELL, rad=CELL/2-2;
  ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
  ctx.fillStyle=type===1?"#222":"#f5f5f5"; ctx.fill();
  if(r===lastR&&c===lastC&&!viewing){ctx.fillStyle="#dc3232";ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fill();}
  if(viewing&&order>0){ctx.fillStyle=type===1?"#ddd":"#333";ctx.font="12px Arial";ctx.textAlign="center";ctx.fillText(order,x,y+4);}
}
function drawGhost(r,c,type){
  const x=MARGIN+c*CELL, y=MARGIN+r*CELL;
  ctx.globalAlpha=0.45;
  ctx.beginPath(); ctx.arc(x,y,CELL/2-2,0,Math.PI*2);
  ctx.fillStyle=type===1?"#444":"#ccc"; ctx.fill();
  ctx.globalAlpha=1;
}
function redraw(showNum=false){
  drawBoard();
  history.forEach((m,i)=>drawPiece(m[0],m[1],board[m[0]][m[1]],showNum?i+1:-1));
  if(!gameOver&&hoverR>=0&&board[hoverR][hoverC]===0) drawGhost(hoverR,hoverC,playerColor);
}
function checkFive(r,c,role){
  const d=[[1,0],[0,1],[1,1],[1,-1]];
  for(let k=0;k<4;k++){
    let cnt=1;
    for(let s=1;s<5;s++){let nr=r+d[k][0]*s,nc=c+d[k][1]*s;if(nr<0||nr>=GRID||nc<0||nc>=GRID||board[nr][nc]!==role)break;cnt++;}
    for(let s=1;s<5;s++){let nr=r-d[k][0]*s,nc=c-d[k][1]*s;if(nr<0||nr>=GRID||nc<0||nc>=GRID||board[nr][nc]!==role)break;cnt++;}
    if(cnt>=5)return true;
  }
  return false;
}
function isForbidden(r,c,role){
  if(!useForbidden||role!==1)return false;
  if(checkFive(r,c,role))return false;
  // 简化禁手检测（演示用）
  return false;
}
function aiEasy(){
  let best=-1,cands=[];
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    if(board[r][c])continue;
    let s=Math.random()*10;
    if(s>best){best=s;cands=[[r,c]];}else if(s===best)cands.push([r,c]);
  }
  return cands[Math.floor(Math.random()*cands.length)]||[9,9];
}
function aiMedium(){ // 简化MCTS
  return aiEasy(); // 网页版中等用随机偏向附近
}
function aiHard(){
  // 简化深度搜索演示
  for(let r=0;r<GRID;r++)for(let c=0;c<GRID;c++){
    if(!board[r][c]){board[r][c]=aiColor;if(checkFive(r,c,aiColor)){board[r][c]=0;return[r,c];}board[r][c]=0;}
  }
  return aiEasy();
}
function doAI(){
  let [r,c]=difficulty===1?aiEasy():difficulty===2?aiMedium():aiHard();
  if(moveCount===0&&aiColor===1){r=9;c=9;}
  board[r][c]=aiColor; history.push([r,c]); lastR=r;lastC=c; moveCount++;
  redraw();
  if(checkFive(r,c,aiColor)){gameOver=true;viewing=true;setTimeout(()=>alert("AI 获胜！"),100);redraw(true);}
}
function startGame(){
  useForbidden=document.getElementById("forbidden").checked;
  if(playerColor===0)playerColor=Math.random()<0.5?1:2;
  aiColor=3-playerColor;
  board=Array.from({length:GRID},()=>Array(GRID).fill(0));
  history=[]; moveCount=0; gameOver=false; viewing=false; lastR=lastC=-1; hoverR=hoverC=-1;
  document.getElementById("menu").style.display="none";
  document.getElementById("ingame").style.display="block";
  redraw();
  if(playerColor===2)setTimeout(doAI,400);
}
function undo(){
  if(history.length<2||gameOver)return;
  let ai=history.pop(); board[ai[0]][ai[1]]=0; moveCount--;
  let pl=history.pop(); board[pl[0]][pl[1]]=0; moveCount--;
  lastR=history.length?history[history.length-1][0]:-1;
  lastC=history.length?history[history.length-1][1]:-1;
  redraw();
}
function backMenu(){
  document.getElementById("ingame").style.display="none";
  document.getElementById("menu").style.display="block";
  gameOver=false;
}
canvas.onmousemove=e=>{
  if(gameOver)return;
  const rect=canvas.getBoundingClientRect();
  let c=Math.round((e.clientX-rect.left-MARGIN)/CELL);
  let r=Math.round((e.clientY-rect.top-MARGIN)/CELL);
  if(r>=0&&r<GRID&&c>=0&&c<GRID&&board[r][c]===0){
    if(r!==hoverR||c!==hoverC){hoverR=r;hoverC=c;redraw();}
  }else if(hoverR!==-1){hoverR=hoverC=-1;redraw();}
};
canvas.onclick=e=>{
  if(gameOver)return;
  const rect=canvas.getBoundingClientRect();
  let c=Math.round((e.clientX-rect.left-MARGIN)/CELL);
  let r=Math.round((e.clientY-rect.top-MARGIN)/CELL);
  if(r<0||r>=GRID||c<0||c>=GRID||board[r][c])return;
  if(moveCount===0&&playerColor===1&&(r!==9||c!==9)){alert("黑棋第一手必须下在天元！");return;}
  board[r][c]=playerColor;
  if(isForbidden(r,c,playerColor)){board[r][c]=0;alert("禁手！");gameOver=true;viewing=true;redraw(true);return;}
  history.push([r,c]); lastR=r;lastC=c; moveCount++; hoverR=hoverC=-1; redraw();
  if(checkFive(r,c,playerColor)){gameOver=true;viewing=true;setTimeout(()=>alert("恭喜你获胜！"),100);redraw(true);return;}
  setTimeout(doAI,300);
};
</script>
</body>
</html>
